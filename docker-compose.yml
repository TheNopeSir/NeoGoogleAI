version: '3.8'

services:
  neoarchive:
    build: .
    container_name: neoarchive_app
    ports:
      - "3002:3002"
    volumes:
      # Persist the database file
      - ./data:/app/data
      # Try to mount .env but don't fail hard if missing (managed via env_file mostly)
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      # Pass variables with empty defaults to allow container start even if host env is missing them
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      - DB_SSL_REJECT_UNAUTHORIZED=false
      # Database
      - DB_HOST=${DB_HOST:-}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # EmailJS
      - EMAILJS_SERVICE_ID=${EMAILJS_SERVICE_ID:-}
      - EMAILJS_TEMPLATE_WELCOME=${EMAILJS_TEMPLATE_WELCOME:-}
      - EMAILJS_TEMPLATE_RESET=${EMAILJS_TEMPLATE_RESET:-}
      - EMAILJS_PUBLIC_KEY=${EMAILJS_PUBLIC_KEY:-}
      - EMAILJS_PRIVATE_KEY=${EMAILJS_PRIVATE_KEY:-}
      # S3
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      # Push Notifications (VAPID)
      - VITE_VAPID_PUBLIC_KEY=${VITE_VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
    restart: unless-stopped